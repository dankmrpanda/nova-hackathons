services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: onboarding-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onboarding_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: onboarding-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: onboarding-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: onboarding-backend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/onboarding_agent
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=onboarding_agent
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=onboarding-artifacts
      - JWT_SECRET=local-dev-secret-change-in-production
      - AIRIA_API_URL=${AIRIA_API_URL:-http://localhost:8080}
      - AIRIA_API_KEY=${AIRIA_API_KEY:-dev-key}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - RETELL_API_KEY=${RETELL_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # Worker for analysis jobs
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.worker
    container_name: onboarding-worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/onboarding_agent
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=onboarding_agent
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=onboarding-artifacts
      - AIRIA_API_URL=${AIRIA_API_URL:-http://localhost:8080}
      - AIRIA_API_KEY=${AIRIA_API_KEY:-dev-key}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - onboarding-network
    restart: unless-stopped

  # Frontend with Nginx
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: onboarding-frontend
    ports:
      - '80:80'
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - onboarding-network
    restart: unless-stopped

networks:
  onboarding-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
