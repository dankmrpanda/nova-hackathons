<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Test GitHub API</h1>
    <form id="testForm">
        <input type="text" id="repoUrl" placeholder="https://github.com/owner/repo" style="width: 400px;">
        <button type="submit">Test API</button>
    </form>
    <div id="result" style="margin-top: 20px; white-space: pre-wrap;"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const repoUrl = document.getElementById('repoUrl').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.textContent = 'Loading...';
            
            try {
                console.log('Sending request to backend...');
                const response = await fetch('http://localhost:3001/api/github/analyze-public', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ repoUrl })
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    resultDiv.textContent = `Error ${response.status}: ${errorText}`;
                    return;
                }
                
                const data = await response.json();
                resultDiv.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.textContent = 'Error: ' + error.message + '\n\nMake sure backend is running on http://localhost:3001';
            }
        });
    </script>
</body>
</html>
