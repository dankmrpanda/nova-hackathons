# Docker Compose for local development with hot reload
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: onboarding-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onboarding_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: onboarding-redis-dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: onboarding-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onboarding-network

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: onboarding-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/onboarding-artifacts --ignore-existing;
      mc anonymous set download local/onboarding-artifacts;
      echo 'MinIO bucket initialized';
      "
    networks:
      - onboarding-network

networks:
  onboarding-network:
    driver: bridge

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
