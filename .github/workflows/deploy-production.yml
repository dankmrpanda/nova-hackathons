name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  # Build and push images
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/codebase-onboarding
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=prod-

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/codebase-onboarding-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ env.ECR_REGISTRY }}/codebase-onboarding-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile.worker
          push: true
          tags: ${{ env.ECR_REGISTRY }}/codebase-onboarding-worker:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migration
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile.migrate
          push: true
          tags: ${{ env.ECR_REGISTRY }}/codebase-onboarding-migrate:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan images for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/codebase-onboarding-backend:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy to production with approval
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://codebase-onboarding.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          aws ecs run-task \
            --cluster codebase-onboarding-production \
            --task-definition codebase-onboarding-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNETS }}],securityGroups=[${{ secrets.SECURITY_GROUP }}]}" \
            --region ${{ env.AWS_REGION }}

      - name: Update ECS services with blue-green deployment
        run: |
          # Update backend service
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-backend \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ env.AWS_REGION }}
          
          # Wait for backend to stabilize
          aws ecs wait services-stable \
            --cluster codebase-onboarding-production \
            --services codebase-onboarding-backend \
            --region ${{ env.AWS_REGION }}
          
          # Update worker service
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-worker \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ env.AWS_REGION }}
          
          # Wait for worker to stabilize
          aws ecs wait services-stable \
            --cluster codebase-onboarding-production \
            --services codebase-onboarding-worker \
            --region ${{ env.AWS_REGION }}
          
          # Update frontend service
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-frontend \
            --force-new-deployment \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=100" \
            --region ${{ env.AWS_REGION }}
          
          # Wait for frontend to stabilize
          aws ecs wait services-stable \
            --cluster codebase-onboarding-production \
            --services codebase-onboarding-frontend \
            --region ${{ env.AWS_REGION }}

      - name: Run smoke tests
        run: |
          curl -f https://codebase-onboarding.example.com/health || exit 1
          curl -f https://codebase-onboarding.example.com/api/health || exit 1

      - name: Run integration tests
        run: |
          # Run critical path tests
          npm ci
          npm run test:integration

      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        if: success()
        with:
          status: success
          text: 'Production deployment successful! Version: ${{ needs.build-and-push.outputs.image-tag }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-backend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-worker \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
          
          aws ecs update-service \
            --cluster codebase-onboarding-production \
            --service codebase-onboarding-frontend \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Notify deployment failure
        uses: 8398a7/action-slack@v3
        if: failure()
        with:
          status: failure
          text: 'Production deployment failed and rolled back!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
